<!DOCTYPE html>
<html>
  <head>
    <title>BTVN 7 - Thiệp mời</title>
    <meta charset="UTF-8">
    <meta name="author" content="Đỗ Anh Đạt">
    <meta name="description" content="Thiết kế web">
    <meta name="keywords" content="20CT2101, Thiết kế web, Khoa công nghệ thông tin, trường Đại học Đà Lạt">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes&effect=3d" rel="stylesheet">
    <style>
      body {
font-family: 'Montserrat', sans-serif;
        display: flex;
    justify-content: center; 
    
    align-items: center;     
    
    min-height: 100vh;       
    
    margin: 0;               
    padding: 20px;          
        background-image: url('bg.png');
        background-attachment: fixed;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .tam-thiep {
        background-color: white;
        width: 350px;
        min-height: 600px;
        padding: 40px 20px;
        text-align: center;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border: 8px solid #fff;
        outline: 2px dashed #d81b60;

      }

      .khung-anh {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid #d81b60;
        padding: 5px;
        margin-bottom: 20px;
      }

      h1 {
        
        font-family: 'Great Vibes', cursive;
        color: #d81b60;
        font-size: 45px;
        margin: 10px 0;
        line-height: 1.2;
      }

      .thong-tin {
        color: #555;
        line-height: 1.8;
        margin: 30px 0;
        font-size: 14px;
      }

      .tam-thiep:hover {
        background-color: #F0EFEB;
        transform: scale(1.05);
        /* Phóng to nhẹ khi di chuột */
      }

      .ke-ngang {
        width: 30%;
        border: none;
        border-top: 1px solid #ccc;
        margin: 20px auto;
      }




    </style>
  </head>
  <body>
    <div class="tam-thiep">
      <img src="img1.png" alt="Ảnh cưới của Khuyến Dương và Misthy" class="khung-anh">
      <p style="font-size: 12px;">SAVE THE DATE</p>
      <h1 class="font-effect-3d">Khuyến Dương <br>& <br>Misthy </h1>
      <hr class="ke-ngang">
      <div class="thong-tin">
        <p>Rất hân hạnh được đón tiếp bạn <br>tại lễ thành hôn của các chị </p>
        <br>
        <p>
          <b>17:00 | 17 . 02 . 2026</b>
        </p>
        <p>Tại <b>Jollibee</b>
        </p>
        <p>phường Xuân Hương - Đà Lạt</p>
      </div>
      <p style="margin-top: 30px; font-size: 12px; color: #999;">Trân trọng.</p>
    </div>
  </body>
</html>
