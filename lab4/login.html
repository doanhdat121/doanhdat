<!DOCTYPE html>
<html>
<head>
    <title>Đăng nhập</title>
    <meta name="author" content="Đỗ Anh Đạt">
    <meta name="description" content="Thiết kế web">
    <meta name="keywords" content="20CT2101, Thiết kế web, Khoa công nghệ thông tin, trường Đại học Đà Lạt">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="https://lms.dlu.edu.vn/pluginfile.php/1/theme_lambda/favicon/1768770164/Logo_DLU.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        
        <div class="column">
            <img src="dlu-a1.png" alt="Ảnh tòa A1 trường đại học Đà Lạt" style="width:100%">
        </div>

        <div class="column">
            <h2 class="center">Đăng nhập hệ thống</h2>
            
            <form method="post" action="login.php">
                <div>
                    <label for="username">Tên đăng nhập:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div>
                    <label for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <button class="btn-submit" type="submit">Đăng nhập</button>
                </div>

                <div>
                    <button class="btn-forget" type="button">Quên mật khẩu</button>
                </div>
            </form> </div>
        
    </div>
</body>
</html>
